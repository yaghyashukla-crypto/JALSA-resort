<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jalsa Resort by Vrindavan — Scan to Find Us</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg1:#0f221a;--bg2:#1a362a;--ink:#f3e9d2;--muted:#c3cfc0;--gold:#d9aa57;--card:#fffaf0;--glow:rgba(217,170,87,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0f221a;--bg2:#1a362a;--ink:#f3e9d2;--muted:#a9b8a8;--gold:#d9aa57;--card:#fffaf0;--glow:rgba(217,170,87,.25)}}
:root[data-theme="dark"]{--bg1:#0f221a;--bg2:#1a362a;--ink:#f3e9d2;--muted:#a9b8a8;--gold:#d9aa57;--card:#fffaf0;--glow:rgba(217,170,87,.25)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Jost','Helvetica Neue',Arial,sans-serif;color:var(--ink);background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg1));display:flex;justify-content:center;overflow-x:hidden}
.wrap{width:100%;max-width:460px;padding:36px 22px 48px;text-align:center;position:relative}
.sun{position:absolute;top:-90px;left:50%;transform:translateX(-50%);width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 65%);pointer-events:none;animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{transform:translateX(-50%) scale(1.12);opacity:.8}}
.eyebrow{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);margin:0 0 14px;position:relative}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(40px,12vw,56px);line-height:.95;margin:0;position:relative}
h1 em{display:block;font-weight:400;font-size:.52em;letter-spacing:.06em;color:var(--gold);margin-top:8px}
.divider{display:flex;align-items:center;gap:12px;justify-content:center;margin:22px auto;color:var(--gold);position:relative}
.divider::before,.divider::after{content:"";height:1px;width:64px;background:linear-gradient(90deg,transparent,var(--gold))}
.divider::after{transform:scaleX(-1)}
.arch{position:relative;margin:8px auto 0;width:min(300px,82vw);padding:14px;border-radius:200px 200px 22px 22px;background:linear-gradient(160deg,var(--gold),transparent 55%,var(--gold));box-shadow:0 30px 60px -20px rgba(0,0,0,.35)}
.arch-in{background:var(--card);border-radius:188px 188px 14px 14px;padding:58px 22px 22px}
#qr{display:flex;justify-content:center;min-height:200px;align-items:center}
#qr img,#qr canvas{border-radius:6px;max-width:100%;height:auto}
.scan{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:20px;color:#1f3a2e;margin:14px 0 2px}
.small{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:#7a6a45}
.addr{margin:30px 0 6px;font-size:15px;line-height:1.7;color:var(--muted);font-weight:300;position:relative}
.addr b{display:block;color:var(--ink);font-weight:500;letter-spacing:.04em;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0 28px}
.chips span{font-size:12px;letter-spacing:.08em;padding:7px 14px;border:1px solid var(--gold);border-radius:99px;color:var(--ink);backdrop-filter:blur(4px)}
.btn{display:inline-block;text-decoration:none;font-size:13px;letter-spacing:.24em;text-transform:uppercase;padding:16px 34px;border-radius:99px;background:var(--gold);color:#1a1409;font-weight:500;box-shadow:0 10px 30px -8px var(--glow);transition:transform .25s}
.btn:hover{transform:translateY(-3px)}
.foot{margin-top:34px;font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
